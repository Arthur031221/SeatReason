<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 675px;
        overflow: hidden;
        background: #f4f1ea;
        color: #1d262b;
        font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif;
      }
      .frame {
        height: 100%;
        padding: 56px 60px;
        display: grid;
        grid-template-columns: 470px 1fr;
        gap: 44px;
        align-items: center;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
      }
      .mark {
        width: 52px;
        height: 52px;
      }
      .name {
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.5px;
      }
      h1 {
        font-size: 46px;
        line-height: 1.12;
        letter-spacing: -1.2px;
        margin: 0 0 22px;
      }
      p {
        font-size: 21px;
        line-height: 1.45;
        color: #4b585e;
        margin: 0 0 26px;
      }
      .facts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .facts span {
        font-size: 15px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 999px;
        background: #dcece7;
        color: #1f6a5e;
      }
      .shot {
        height: 563px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #d9d3c4;
        background: #fffdf8;
        box-shadow: 0 18px 50px rgb(30 30 20 / 18%);
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top left;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <div class="head">
          <img class="mark" src="logo.svg" alt="" />
          <div class="name">SeatReason</div>
        </div>
        <h1>Impossible seating rules, explained.</h1>
        <p>
          Finds the smallest set of rules that clash, then checks a repair
          before you print.
        </p>
        <div class="facts">
          <span>Private</span><span>Offline</span><span>9 languages</span>
        </div>
      </div>
      <div class="shot"><img src="social-card-capture.png" alt="" /></div>
    </div>
  </body>
</html>
